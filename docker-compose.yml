services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vitrine
      POSTGRES_USER: vitrine
      POSTGRES_PASSWORD: vitrine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrine -d vitrine"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://vitrine:vitrine@db:5432/vitrine
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      SEED_ON_START: "1"
      DJANGO_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info --concurrency=1
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://vitrine:vitrine@db:5432/vitrine
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      SEED_ON_START: "0"
      DJANGO_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
